name: Review default infrastructure images
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [current, candidate]
        default: current
        description: Current defaults or review-only upgrade candidates (no deployment)
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [db, ollama]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv && .venv/bin/pip install 'httpx==0.28.1' 'PyYAML==6.0.3'
      - name: Reserve scanner space on the disposable hosted Ollama audit VM
        if: matrix.service == 'ollama'
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # Only unused SDK installations on this new ephemeral audit VM. Never
          # run this on the owner/Cloud host; no home, volume or image pruning.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
          available="$(df -B1 --output=avail / | tail -n 1)"
          test "$available" -ge 25769803776
      - name: Inspect the exact default Compose dependency without executing it
        env:
          SERVICE: ${{ matrix.service }}
          MODE: ${{ inputs.mode }}
        run: |
          image_ref="$(.venv/bin/python -c 'import os,yaml; print({"db":"postgres:17-alpine","ollama":"ollama/ollama:0.40.13"}[os.environ["SERVICE"]] if os.environ["MODE"]=="candidate" else yaml.safe_load(open("compose.yaml"))["services"][os.environ["SERVICE"]]["image"])')"
          docker pull --platform linux/amd64 "$image_ref"
          if [ "$MODE" = candidate ] && [ "$SERVICE" = db ]; then
            docker build -f deployment/postgres/Dockerfile -t foxory-postgres:review .
            image_ref=foxory-postgres:review
          fi
          image_id="$(docker image inspect "$image_ref" --format '{{.Id}}')"
          docker image inspect "$image_ref" --format '{{json .RepoDigests}}' > /tmp/repo-digests.json
          .venv/bin/python scripts/image_audit.py --image "$image_id" --output /tmp/image-audit
      - name: Candidate PostgreSQL fresh migration, isolation and restore
        if: inputs.mode == 'candidate' && matrix.service == 'db'
        run: |
          .venv/bin/pip install -r backend/requirements.lock
          .venv/bin/pip install --no-deps -e backend
          image_id="$(.venv/bin/python -c 'import json; print(json.load(open("/tmp/image-audit/summary.json"))["image"])')"
          .venv/bin/python scripts/phase4_postgres_smoke.py --image "$image_id" > /tmp/database-runtime.json
      - name: Candidate actual CPU completion and embedding with temporary free models
        if: inputs.mode == 'candidate' && matrix.service == 'ollama'
        run: |
          image_id="$(.venv/bin/python -c 'import json; print(json.load(open("/tmp/image-audit/summary.json"))["image"])')"
          .venv/bin/python scripts/ollama_candidate_smoke.py --image "$image_id" --evidence /tmp/model-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-${{ inputs.mode }}-${{ matrix.service }}-audit
          path: |
            /tmp/repo-digests.json
            /tmp/image-audit/
            /tmp/database-runtime.json
            /tmp/model-runtime.json
# Current mode is static only. Explicit candidate mode also uses disposable
# services/models/fresh data after the image gate; no owner volume/deployment.
