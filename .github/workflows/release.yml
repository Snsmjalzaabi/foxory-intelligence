name: Prepare release artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t foxory-intelligence:review .
      - run: docker save foxory-intelligence:review | gzip > foxory-intelligence-review.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: review-image
          path: foxory-intelligence-review.tar.gz
# No registry push, public release, deployment or repository publication.
# Owner review and verified release gates are required before public release.
