name: Real Compose and rootless manager integration
on:
  workflow_dispatch:
    inputs:
      ubuntu:
        type: choice
        options: ['24.04', '26.04']
        default: '24.04'
        description: Standard hosted Ubuntu version; no self-hosted or paid runner
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ${{ inputs.ubuntu == '26.04' && 'ubuntu-26.04' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare disposable host and dedicated non-Docker account
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y podman uidmap fuse-overlayfs dbus-user-session python3-venv
          sudo useradd --create-home --shell /bin/bash foxory-ci-sandbox
          sandbox_uid="$(id -u foxory-ci-sandbox)"
          sandbox_gid="$(id -g foxory-ci-sandbox)"
          sudo install -d -m 0755 "/etc/systemd/system/user@$sandbox_uid.service.d"
          # This hosted image has runner-wide XDG defaults. Correct only this
          # NEW account's manager, after PAM env processing; retain notify/delegation.
          printf '[Service]\nDelegate=cpu memory pids\nExecStart=\nExecStart=/usr/bin/env -u CONTAINERS_STORAGE_CONF -u CONTAINERS_CONF -u CONTAINER_HOST HOME=/home/foxory-ci-sandbox XDG_CONFIG_HOME=/home/foxory-ci-sandbox/.config XDG_DATA_HOME=/home/foxory-ci-sandbox/.local/share XDG_RUNTIME_DIR=/run/user/%s DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus /usr/lib/systemd/systemd --user\n' "$sandbox_uid" "$sandbox_uid" | sudo tee "/etc/systemd/system/user@$sandbox_uid.service.d/delegate.conf" >/dev/null
          sudo systemctl daemon-reload
          sudo loginctl enable-linger foxory-ci-sandbox
          sudo systemctl start "user@$sandbox_uid.service"
          sudo -u foxory-ci-sandbox -H mkdir -m 0700 /home/foxory-ci-sandbox/foxory-intelligence
          git archive HEAD | sudo -u foxory-ci-sandbox -H tar -x -C /home/foxory-ci-sandbox/foxory-intelligence
          sudo install -d -o "$sandbox_uid" -g "$sandbox_gid" -m 0750 "/run/foxory-fixture-$GITHUB_RUN_ID"
      - name: Build reviewed worker as the rootless account under delegated scope
        run: |
          sandbox_uid="$(id -u foxory-ci-sandbox)"
          sudo -u foxory-ci-sandbox -H env -i HOME=/home/foxory-ci-sandbox USER=foxory-ci-sandbox LOGNAME=foxory-ci-sandbox \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            XDG_RUNTIME_DIR="/run/user/$sandbox_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$sandbox_uid/bus" \
            systemd-run --user --scope --property=Delegate=yes --expand-environment=no bash -c '
              set -euo pipefail
              umask 077
              cd "$HOME/foxory-intelligence"
              python3 -m venv .venv
              .venv/bin/pip install -r backend/requirements.lock
              .venv/bin/pip install --no-deps -e backend
              .venv/bin/python scripts/verify_worker_supply_chain.py --online
              podman --remote=false build -f sandbox_manager/runtime/Dockerfile -t localhost/foxory-worker:integration sandbox_manager/runtime
              image_id="$(podman --remote=false image inspect localhost/foxory-worker:integration --format "{{.Id}}")"
              case "$image_id" in sha256:*) ;; *) image_id="sha256:$image_id" ;; esac
              printf "%s\n" "$image_id" > "$HOME/worker-image-id.txt"
              # Audit this exact rootless image BEFORE any task execution.
              # The verifier checks config and EVERY layer hash in the export.
              archive_dir="$(mktemp -d "$HOME/foxory-worker-audit.XXXXXX")"
              trap "rm -f -- \"$archive_dir/worker.tar\"; rmdir -- \"$archive_dir\"" EXIT
              podman --remote=false save --format docker-archive --output "$archive_dir/worker.tar" "$image_id"
              .venv/bin/python scripts/image_audit.py --image "$image_id" \
                --archive "$archive_dir/worker.tar" --worker --output "$HOME/worker-image-audit"
            '
      - name: Real systemd socket, Compose bridge, local model and delegated workflows
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.lock
          .venv/bin/pip install --no-deps -e backend
          image_id="$(sudo -u foxory-ci-sandbox cat /home/foxory-ci-sandbox/worker-image-id.txt)"
          .venv/bin/python scripts/compose_manager_acceptance.py --worker-image "$image_id" \
            --ipc "/run/foxory-fixture-$GITHUB_RUN_ID" --evidence /tmp/full-host-evidence
      - name: Actual CPU PID OOM cancellation and crash recovery on the same OS
        run: |
          sandbox_uid="$(id -u foxory-ci-sandbox)"
          sudo -u foxory-ci-sandbox -H env -i HOME=/home/foxory-ci-sandbox USER=foxory-ci-sandbox LOGNAME=foxory-ci-sandbox \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            XDG_RUNTIME_DIR="/run/user/$sandbox_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$sandbox_uid/bus" \
            systemd-run --user --scope --property=Delegate=yes --expand-environment=no bash -c '
              set -euo pipefail
              umask 077
              cd "$HOME/foxory-intelligence"
              image_id="$(cat "$HOME/worker-image-id.txt")"
              .venv/bin/python scripts/oci_host_acceptance.py --image "$image_id" --evidence "$HOME/acceptance/tcp"
              .venv/bin/python scripts/oci_host_acceptance.py --image "$image_id" --transport unix --evidence "$HOME/acceptance/unix"
            '
      - name: Retain only disposable fixture security evidence
        if: always()
        run: |
          install -d -m 0700 /tmp/full-host-evidence
          if sudo test -d /home/foxory-ci-sandbox/acceptance; then
            sudo cp -r /home/foxory-ci-sandbox/acceptance /tmp/full-host-evidence/security
            sudo chown -R "$(id -u):$(id -g)" /tmp/full-host-evidence/security
          fi
          if sudo test -d /home/foxory-ci-sandbox/worker-image-audit; then
            sudo cp -r /home/foxory-ci-sandbox/worker-image-audit /tmp/full-host-evidence/image-audit
            sudo chown -R "$(id -u):$(id -g)" /tmp/full-host-evidence/image-audit
          fi
      - name: Require the audited and executed immutable worker to match
        run: |
          image_id="$(sudo -u foxory-ci-sandbox cat /home/foxory-ci-sandbox/worker-image-id.txt)"
          .venv/bin/python scripts/verify_host_image_evidence.py --image "$image_id" --evidence /tmp/full-host-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-compose-rootless-integration-${{ inputs.ubuntu }}
          path: /tmp/full-host-evidence/
# Explicit ephemeral fixture only. Does not deploy the owner stack, expose a
# public endpoint, grant the manager Docker access or execute generated code in
# the controller/application. Required startup controls stay fail-closed.
