name: foxory-intelligence
services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:${FOXORY_PORT:-8000}:8000"
    environment:
      FOXORY_TOKEN: ${FOXORY_TOKEN:?Run python scripts/setup.py first}
      FOXORY_ALLOWED_HOSTS: ${FOXORY_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      FOXORY_SECURE_COOKIES: ${FOXORY_SECURE_COOKIES:-0}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      DATABASE_URL: postgresql+psycopg://foxory:${POSTGRES_PASSWORD:?Run setup first}@db:5432/foxory
      OLLAMA_URL: http://ollama:11434
      SEARXNG_URL: ${SEARXNG_URL:-}
      FOXORY_ENABLE_SANDBOX: ${FOXORY_ENABLE_SANDBOX:-0}
      FOXORY_SANDBOX_URL: ${FOXORY_SANDBOX_URL:-}
      FOXORY_SANDBOX_SOCKET: ${FOXORY_SANDBOX_SOCKET:-}
      FOXORY_SANDBOX_KEY: ${FOXORY_SANDBOX_KEY:-}
      FOXORY_BACKGROUND_CONTEXT: ${FOXORY_BACKGROUND_CONTEXT:-2048}
      FOXORY_BACKGROUND_OUTPUT: ${FOXORY_BACKGROUND_OUTPUT:-256}
      FOXORY_WORKER_CONCURRENCY: ${FOXORY_WORKER_CONCURRENCY:-1}
      FOXORY_INFERENCE_THREADS: ${FOXORY_INFERENCE_THREADS:-2}
      FOXORY_ALLOW_PARALLEL_COUNCIL: ${FOXORY_ALLOW_PARALLEL_COUNCIL:-0}
    volumes:
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    restart: unless-stopped
  db:
    # No implicit database-family switch for existing installations. setup.py
    # selects modern only for NEW .env files; see docs/DATABASE_UPGRADE.md.
    image: foxory-postgres:${FOXORY_DATABASE_LAYOUT:?Run setup.py for a new installation; existing installations must read docs/DATABASE_UPGRADE.md}-17-community
    build:
      context: .
      dockerfile: deployment/postgres/Dockerfile
      target: ${FOXORY_DATABASE_LAYOUT:?Select modern or legacy deliberately}
    environment:
      POSTGRES_DB: foxory
      POSTGRES_USER: foxory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U foxory -d foxory -Atqc "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    restart: unless-stopped
  ollama:
    build:
      context: .
      target: ollama
    image: foxory-ollama:0.40.13-pcre2-10.49-community
    environment:
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "8"
    volumes:
      - ollama_data:/root/.ollama
    security_opt: [no-new-privileges:true]
    mem_limit: 16g
    restart: unless-stopped
volumes:
  app_data:
  postgres_data:
  ollama_data:
