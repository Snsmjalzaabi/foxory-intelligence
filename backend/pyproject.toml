[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "foxory-intelligence"
version = "0.1.0"
description = "Local-first AI workspace — Community Edition"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "httpx>=0.27,<1", "python-multipart>=0.0.20,<1", "pypdf>=5,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["foxory*"]
